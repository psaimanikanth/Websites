<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8ecd2">
  <title>Athish &amp; Niharika — Engagement Invitation</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="script.js?v=2" defer></script>
</head>
<body>
  <main class="page">
    <figure class="invitation">
      <img src="engagement-invitation-youtube.png" alt="Engagement invitation for Athish Chowdary Vallabhaneni and Niharika Yerneni, Saturday, November 14, 2026 at 10:00 AM, at G. V. Purna Chandra Rao Community Hall, Gudivada, Krishna District.">
      <a class="hotspot maps-hotspot" href="https://www.google.com/maps/search/?api=1&amp;query=G.%20V.%20Purna%20Chandra%20Rao%20Community%20Hall%2C%20Gudivada%2C%20Krishna%20District%2C%20Andhra%20Pradesh%2C%20India" target="_blank" rel="noopener noreferrer" aria-label="Open the venue in Google Maps"></a>
      <a class="hotspot youtube-hotspot" id="youtube-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Watch live on YouTube"></a>
    </figure>
    <section class="countdown" aria-labelledby="countdown-title">
      <p class="countdown-kicker">Days away from forever &#x2764;&#xFE0F;</p>
      <h1 id="countdown-title">Counting down to the special occasion</h1>
      <div class="countdown-grid" id="countdown" aria-label="Countdown to the engagement ceremony">
        <div class="countdown-unit"><span id="days">--</span><small>Days</small></div>
        <div class="countdown-unit"><span id="hours">--</span><small>Hours</small></div>
        <div class="countdown-unit"><span id="minutes">--</span><small>Minutes</small></div>
        <div class="countdown-unit"><span id="seconds">--</span><small>Seconds</small></div>
      </div>
      <p class="countdown-message" id="countdown-message" role="status" hidden>The special day is here!</p>
    </section>
    <footer class="family-note" aria-labelledby="family-note-title">
      <div class="family-note-divider" aria-hidden="true"><span>&#x2726;</span></div>
      <h2 class="family-note-greeting" id="family-note-title">With love,</h2>
      <p class="family-note-intro">The Families of</p>
      <p class="family-note-names">Athish Chowdary Vallabhaneni<br><span>&amp;</span> Niharika Yerneni</p>
    </footer>
  </main>
</body>
</html>
